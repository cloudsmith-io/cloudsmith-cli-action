name: Zizmor

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "action.yml"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "action.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pipx install zizmor

      - name: Run zizmor
        run: zizmor --pedantic .github/workflows/ action.yml
