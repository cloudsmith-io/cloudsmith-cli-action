name: Release

# Releases the newest version in CHANGELOG.md when no tag exists for it yet.
# The test matrix must pass before the tag and the GitHub release are created.
on:
  push:
    branches:
      - master
    paths:
      - CHANGELOG.md
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  version:
    name: Find the version to release
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Read the newest CHANGELOG version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^## \[\([0-9]*\.[0-9]*\.[0-9]*\)\].*/\1/p' CHANGELOG.md | head -n 1)"
          test -n "$version"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || status=$?
          case "$status" in
            0) echo "$tag is already released"; echo "released=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "$tag is not released yet"; echo "released=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  test:
    name: Test
    needs: version
    if: needs.version.outputs.released == 'false'
    permissions:
      contents: read
      id-token: write # required whenever OIDC inputs are set
    uses: $/.github/workflows/test.yml
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

  release:
    name: Create release and move major tag
    needs: [version, test]
    permissions:
      contents: write # create the release and move the major tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "Release $TAG" --target "$GITHUB_SHA"

      - name: Update floating major tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          major="${TAG%%.*}"
          echo "Pointing $major at $TAG ($GITHUB_SHA)"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" \
            -f "sha=$GITHUB_SHA" -F "force=true" \
            || gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$major" -f "sha=$GITHUB_SHA"
